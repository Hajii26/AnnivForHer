<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>12th With You</title>

    <style>
      @font-face {
        font-family: "Cormorant Garamond";
        src: url("../assets/fonts/CormorantGaramond-VariableFont_wght.ttf")
          format("truetype");
        font-weight: 500;
        font-style: normal;
      }

      @font-face {
        font-family: "Cormorant Garamond";
        src: url("../assets/fonts/CormorantGaramond-VariableFont_wght.ttf")
          format("truetype");
        font-weight: 700;
        font-style: normal;
      }

      @font-face {
        font-family: "Cormorant Garamond";
        src: url("../assets/fonts/CormorantGaramond-Italic.ttf")
          format("truetype");
        font-weight: 500;
        font-style: italic;
      }

      @font-face {
        font-family: "Nunito Sans";
        src: url("../assets/fonts/NunitoSans.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
      }

      @font-face {
        font-family: "Nunito Sans";
        src: url("../assets/fonts/NunitoSans.ttf") format("truetype");
        font-weight: 600;
        font-style: normal;
      }

      :root {
        --navy: #0b1f4a;
        --deep: #14346e;
        --sky: #4a90e2;
        --ice: #dcebfb;
        --mist: #f2f7fd;
        --ink: #0d1b3a;
        --r: 16px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Nunito Sans", system-ui, sans-serif;
        color: var(--ink);
        background: linear-gradient(
          160deg,
          var(--navy),
          var(--deep) 55%,
          #2b5fb0
        );
        min-height: 100vh;
        line-height: 1.5;
      }

      h1,
      h2 {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-weight: 700;
      }

      :focus-visible {
        outline: 3px solid #fff;
        outline-offset: 2px;
      }

      .hidden {
        display: none !important;
      }

      /* Login */
      #login {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .login-box {
        width: 100%;
        max-width: 420px;
        background: var(--mist);
        border-radius: 24px;
        padding: 36px 28px;
        box-shadow: 0 24px 60px rgba(0, 10, 40, 0.45);
        text-align: center;
      }

      .login-box h1 {
        font-size: 2.4rem;
        color: var(--navy);
      }

      .tag {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-size: 1.25rem;
        color: var(--deep);
        margin: 6px 0 24px;
      }

      label {
        display: block;
        text-align: left;
        font-weight: 600;
        font-size: 0.9rem;
        margin: 14px 0 6px;
        color: var(--deep);
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 2px solid var(--ice);
        border-radius: 12px;
        font: inherit;
        background: #fff;
      }

      input:focus {
        border-color: var(--sky);
        outline: none;
      }

      .btn {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        cursor: pointer;
        transition:
          transform 0.15s,
          background 0.15s;
      }

      .btn:active {
        transform: scale(0.97);
      }

      .primary {
        background: var(--deep);
        color: #fff;
        width: 100%;
        margin-top: 22px;
      }
      .primary:hover {
        background: var(--navy);
      }
      .ghost {
        background: var(--ice);
        color: var(--deep);
        width: 100%;
        margin-top: 10px;
      }
      .ghost:hover {
        background: #c8def6;
      }
      .err {
        color: #b3261e;
        font-size: 0.9rem;
        min-height: 1.3em;
        margin-top: 12px;
      }

      /* Clue modal */
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(5, 15, 40, 0.65);
        display: grid;
        place-items: center;
        padding: 20px;
        z-index: 20;
      }
      .modal-card {
        background: #fff;
        border-radius: 20px;
        max-width: 360px;
        width: 100%;
        padding: 28px;
        text-align: center;
        animation: pop 0.25s ease-out;
      }
      @keyframes pop {
        from {
          transform: scale(0.85);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      .modal-card h2 {
        color: var(--navy);
        font-size: 1.8rem;
        margin-bottom: 10px;
      }
      .modal-card p {
        margin-bottom: 6px;
      }

      /* Home */
      header {
        text-align: center;
        color: #fff;
        padding: 56px 20px 28px;
      }
      header h1 {
        font-size: clamp(2.4rem, 7vw, 4.2rem);
      }
      header p {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-size: clamp(1.2rem, 3vw, 1.7rem);
        color: var(--ice);
        margin-top: 8px;
      }
      nav {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        max-width: 900px;
        margin: 20px auto;
        padding: 0 20px;
      }
      nav a {
        background: var(--mist);
        color: var(--navy);
        text-decoration: none;
        border-radius: var(--r);
        padding: 22px 10px;
        text-align: center;
        font-weight: 600;
        transition:
          transform 0.2s,
          background 0.2s;
      }
      nav a:hover {
        transform: translateY(-4px);
        background: #fff;
      }
      nav img {
        width: 34px;
        height: 34px;
        display: block;
        margin: 0 auto 8px;
        stroke: var(--sky);
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .gallery-wrap {
        max-width: 1000px;
        margin: 36px auto 0;
        padding: 0 20px 60px;
      }
      .gallery-wrap h2 {
        color: #fff;
        font-size: 2rem;
        text-align: center;
        margin-bottom: 18px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .grid button {
        border: 0;
        padding: 0;
        border-radius: var(--r);
        overflow: hidden;
        cursor: pointer;
        aspect-ratio: 1;
        background: none;
      }
      .grid img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.3s;
      }
      .grid button:hover img {
        transform: scale(1.07);
      }

      /* Lightbox */
      #lightbox {
        background: rgba(3, 10, 30, 0.92);
        flex-direction: column;
      }
      #lightbox:not(.hidden) {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #lightbox img {
        max-width: 92vw;
        max-height: 72vh;
        border-radius: var(--r);
      }
      #lightbox .cap {
        color: #fff;
        margin: 14px 0;
        font-family: "Cormorant Garamond", serif;
        font-size: 1.3rem;
      }
      .lb-btns {
        display: flex;
        gap: 10px;
      }
      .lb-btns .btn {
        background: var(--ice);
        color: var(--navy);
      }

      @media (max-width: 820px) {
        nav {
          grid-template-columns: repeat(2, 1fr);
        }
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 420px) {
        .login-box {
          padding: 28px 20px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- LOGIN FIRST -->
    <section id="login">
      <div class="login-box">
        <h1>It's Always You</h1>
        <p class="tag">No one replace you in my heart.</p>
        <form id="loginForm" novalidate>
          <label for="user">Username</label>
          <input id="user" autocomplete="username" required />
          <label for="pass">Password</label>
          <input
            id="pass"
            type="password"
            autocomplete="current-password"
            required
          />
          <div class="err" id="err" role="alert"></div>
          <button class="btn primary" type="submit">Log in</button>
          <button class="btn ghost" type="button" id="clueBtn">Clues</button>
        </form>
      </div>
    </section>

    <!-- CLUE POP-UP -->
    <div
      class="modal hidden"
      id="clueModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="clueTitle"
    >
      <div class="modal-card">
        <h2 id="clueTitle">A little clue</h2>
        <p>Username: what I call you everyday.</p>
        <p>Password: how long I plan to love you.</p>
        <br />
        <p>Goodluck my Lady!</p>
        <button class="btn primary" id="closeClue">Back</button>
      </div>
    </div>

    <!-- HOME (after login) -->
    <main id="home" class="hidden">
      <header>
        <h1>Welcome my Love</h1>
        <p>Every moment with you is precious.</p>
      </header>

      <nav aria-label="Main">
        <a href="htmlFolders/envelope.html"
          ><img
            src="AnnivForHer/assets/icons/envelope-icon.png"
            alt="Envelope Icon"
            style="width: 40px; height: 40px; align-items: center"
          />Secret</a
        >
        <a href="htmlFolders/moments.html"
          ><img
            src="AnnivForHer/assets/icons/memories-icon.png"
            alt="Two person wit hesrt Icon"
            style="width: 40px; height: 40px; align-items: center"
          />Life With You</a
        >
        <a href="htmlFolders/question.html"
          ><img
            src="AnnivForHer/assets/icons/question-icon.png"
            alt="A bubble chat with Q and A"
            style="width: 40px; height: 40px; align-items: center"
          />Question & Answer</a
        >
        <a href="htmlFolders/game.html"
          ><img
            src="AnnivForHer/assets/icons/flip-card-icon.png"
            alt="Card with heart in the middle"
            style="width: 40px; height: 40px; align-items: center"
          />Flip Cards</a
        >
      </nav>

      <section class="gallery-wrap">
        <h2>Our Memories</h2>
        <div class="grid" id="grid"></div>
      </section>
    </main>

    <!-- LIGHTBOX -->
    <div
      class="modal hidden"
      id="lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Photo viewer"
    >
      <img id="lbImg" alt="" />
      <div class="cap" id="lbCap"></div>
      <div class="lb-btns">
        <button class="btn" id="prev">Previous</button>
        <button class="btn" id="next">Next</button>
        <button class="btn" id="closeLb">Close</button>
      </div>
    </div>

    <script>
      // Demo login (change these, and move real auth to a server)
      const USER = "baby",
        PASS = "forever";

      const $ = (id) => document.getElementById(id);

      // Remember the login on this device, so it also works in a new tab
      // (the reward page opens in one, and sessionStorage is empty there).
      // reward.html refreshes the same key when a reward is claimed.
      const LOGIN_REMEMBER_HOURS = 24; // 0 = always ask for the login
      const LOGIN_KEY = "siteLogin";

      // index.html?logout forgets the saved login (handy for testing)
      if (new URLSearchParams(location.search).has("logout")) {
        sessionStorage.removeItem("loggedIn");
        try {
          localStorage.removeItem(LOGIN_KEY);
        } catch (e) {}
      }

      function loginRemembered() {
        try {
          const t = +localStorage.getItem(LOGIN_KEY);
          return (
            LOGIN_REMEMBER_HOURS > 0 &&
            t > 0 &&
            Date.now() - t < LOGIN_REMEMBER_HOURS * 3600000
          );
        } catch (e) {
          return false;
        }
      }

      // Clue pop-up
      $("clueBtn").onclick = () => $("clueModal").classList.remove("hidden");
      $("closeClue").onclick = () => $("clueModal").classList.add("hidden");
      $("clueModal").onclick = (e) => {
        if (e.target.id === "clueModal") $("clueModal").classList.add("hidden");
      };

      // Login
      function showHome() {
        $("login").classList.add("hidden");
        $("home").classList.remove("hidden");
        window.scrollTo(0, 0);
      }

      // Already logged in? Skip the login screen
      if (sessionStorage.getItem("loggedIn") === "true" || loginRemembered()) {
        showHome();
      }

      $("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        if (
          $("user").value.trim().toLowerCase() === USER &&
          $("pass").value === PASS
        ) {
          sessionStorage.setItem("loggedIn", "true");
          try {
            localStorage.setItem(LOGIN_KEY, String(Date.now()));
          } catch (e) {}
          showHome();
        } else {
          $("err").textContent =
            "Wrong username or password. Tap Clues for a hint.";
        }
      });

      // Gallery: replace src with your own photos, e.g. "photos/one.jpg"
      const hues = [212, 200, 225, 190, 235, 205];
      const caps = [
        "First Meet & Courtship Granted",
        "First Date",
        "First Flower You Received",
        '"Tayo Na"',
        "Bonding Time",
        "Late Night Talks",
      ];
      const photos = [
        { cap: caps[0], src: "assets/images/court.jpg" },
        { cap: caps[1], src: "assets/images/first-date.png" },
        { cap: caps[2], src: "assets/images/flower.jpg" },
        { cap: caps[3], src: "assets/images/tayo-na.jpg" },
        { cap: caps[4], src: "assets/images/codm.jpg" },
        { cap: caps[5], src: "assets/images/vid-call.jpg" },
      ];

      photos.forEach((p, i) => {
        const b = document.createElement("button");
        b.setAttribute("aria-label", "Open photo: " + p.cap);
        b.innerHTML = `<img src="${p.src}" alt="${p.cap}">`;
        b.onclick = () => open(i);
        $("grid").appendChild(b);
      });

      let cur = 0;
      function show(i) {
        cur = (i + photos.length) % photos.length;
        $("lbImg").src = photos[cur].src;
        $("lbImg").alt = photos[cur].cap;
        $("lbCap").textContent = photos[cur].cap;
      }
      function open(i) {
        show(i);
        $("lightbox").classList.remove("hidden");
      }
      function close() {
        $("lightbox").classList.add("hidden");
      }
      $("prev").onclick = () => show(cur - 1);
      $("next").onclick = () => show(cur + 1);
      $("closeLb").onclick = close;
      $("lightbox").onclick = (e) => {
        if (e.target.id === "lightbox") close();
      };
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          close();
          $("clueModal").classList.add("hidden");
        }
        if (!$("lightbox").classList.contains("hidden")) {
          if (e.key === "ArrowRight") show(cur + 1);
          if (e.key === "ArrowLeft") show(cur - 1);
        }
      });
    </script>
  </body>
</html>
