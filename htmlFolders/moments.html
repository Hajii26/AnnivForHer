<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moments with my World</title>
<style>
  @font-face {
  font-family: "Cormorant Garamond";
  src: url("../assets/fonts/CormorantGaramond-VariableFont_wght.ttf") format("truetype");
  font-weight: 500;
  font-style: normal;
}

@font-face {
  font-family: "Cormorant Garamond";
  src: url("../assets/fonts/CormorantGaramond-VariableFont_wght.ttf") format("truetype");
  font-weight: 700;
  font-style: normal;
}

@font-face {
  font-family: "Cormorant Garamond";
  src: url("../assets/fonts/CormorantGaramond-Italic.ttf") format("truetype");
  font-weight: 500;
  font-style: italic;
}

@font-face {
  font-family: "Nunito Sans";
  src: url("../assets/fonts/NunitoSans.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
}

@font-face {
  font-family: "Nunito Sans";
  src: url("../assets/fonts/NunitoSans.ttf") format("truetype");
  font-weight: 600;
  font-style: normal;
}


:root{--navy:#0b1f4a;--deep:#14346e;--sky:#4a90e2;--ice:#dcebfb;--night:#050b1a;--gold:#ffd98a;--rose:#ff9bbd}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:"Nunito Sans",system-ui,sans-serif;color:var(--ice);background:radial-gradient(ellipse at 20% 0%,#10306b55,transparent 55%),radial-gradient(ellipse at 90% 60%,#1a4a9a40,transparent 55%),var(--night);overflow-x:hidden}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
section{padding:56px 0}
.head{text-align:center;padding:0 16px;margin-bottom:26px}
.head h2{font-size:clamp(1.9rem,5vw,2.8rem);color:#fff}
.head p{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--gold);font-size:1.2rem}

/* shared placeholder for empty image/video slots */
.ph{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-weight:600;color:var(--ice);opacity:.85;padding:8px;font-size:.95rem}
.ph small{display:block;font-weight:400;font-size:.75rem;opacity:.7;margin-top:4px}
.has .ph{display:none}
.slide img,.tile img,.tile video,.vbox video{width:100%;height:100%;object-fit:cover;display:block}
.tile video,.vbox video{visibility:hidden}
.has video{visibility:visible!important}

/* ---------- 1. CAROUSEL (top) ---------- */
.top{padding-top:28px}
.top .head{margin-bottom:18px}
.carousel{position:relative}
.track{position:relative;display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px calc((100vw - min(78vw,760px))/2);scrollbar-width:none; padding-bottom: 30px; padding-top: 30px;}
.track::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 min(78vw,760px);aspect-ratio:16/10;scroll-snap-align:center;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,var(--deep),#2b5fb0);border:2px solid #dcebfb44;transform:scale(.9);opacity:.5;transition:transform .5s,opacity .5s,box-shadow .5s}
.track.jumping .slide{transition:none!important}
.slide.active{transform:scale(1);opacity:1;box-shadow:0 0 20px 10px #4a90e288}
.arrow{position:absolute;top:50%;translate:0 -50%;z-index:3;width:46px;height:46px;border:0;border-radius:50%;background:#050b1acc;color:var(--gold);font-size:1.5rem;cursor:pointer;border:2px solid var(--gold)}
.arrow:hover{background:var(--gold);color:var(--night)}
.prev{left:max(8px,calc((100vw - min(78vw,760px))/4 - 23px))}
.next{right:max(8px,calc((100vw - min(78vw,760px))/4 - 23px))}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:0 16px}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:#dcebfb44;cursor:pointer;transition:.3s}
.dots button.on{background:var(--gold);width:26px;border-radius:6px}

/* ---------- 2. ANNIVERSARY TEXT (middle) ---------- */
.hero{position:relative;min-height:80vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 50%,#14346e66,transparent 65%)}
.anni{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;line-height:.95;text-align:center;padding:0 12px}
.anni span{position:relative;white-space:nowrap}
.one{font-size:clamp(4.5rem,22vw,11rem);color:#fff6dc;text-shadow:0 0 8px #fff,0 0 24px var(--gold),0 0 40px #ffb84d}
.two{font-size:clamp(2.2rem,13vw,7rem);letter-spacing:.03em;font-style:italic;color:#fff;text-shadow:0 0 8px #fff,0 0 22px #7ab8ff,0 0 40px var(--sky)}
.one::after,.two::after{content:attr(data-text);position:absolute;inset:0;color:transparent;opacity:.6;will-change:opacity;animation:pulse 3.2s ease-in-out infinite alternate}
.one::after{text-shadow:0 0 70px #ffb84d,0 0 110px #ff9a3c}
.two::after{text-shadow:0 0 62px var(--sky),0 0 90px #2b5fb0,0 0 110px #3a74cc}
@keyframes pulse{from{opacity:.15}to{opacity:1}}
/* animations are paused while their section is off-screen (keeps scrolling smooth) */
.paused,.paused *,.paused *::after{animation-play-state:paused!important}
.sp{position:absolute;will-change:transform,opacity;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:tw ease-in-out infinite;opacity:0}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}

/* ---------- 3. UNIQUE MOSAIC GALLERY ---------- */
.mosaic{max-width:1100px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:100px;grid-auto-flow:dense;gap:14px}
.tile{--rot:0deg;--sc:1;position:relative;overflow:hidden;background:linear-gradient(135deg,#14346e,#2b5fb0);transform:rotate(var(--rot)) scale(var(--sc));transition:transform .35s,box-shadow .35s;box-shadow:0 8px 24px #00000066}
.tile:nth-child(even){background:linear-gradient(135deg,#0b1f4a,#4a90e2)}
.tile:hover{--sc:1.04;z-index:2;box-shadow:0 0 30px #4a90e2aa}
.tA{grid-area:span 3/span 2;border-radius:999px 999px 18px 18px}
.tB{grid-area:span 2/span 3;border-radius:28px;border:2px solid var(--gold)}
.tC{grid-area:span 3/span 1;border-radius:999px}
.tD{grid-area:span 1/span 2;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}
.tE{grid-area:span 1/span 1;border-radius:50%}
.tF{grid-area:span 3/span 3;border-radius:44px 8px 44px 8px;border:2px solid var(--rose)}
.tG{grid-area:span 2/span 3;clip-path:polygon(0 0,100% 6%,100% 100%,0 94%)}
.tH{grid-area:span 1/span 2;border-radius:999px 16px 999px 16px}
.tI{grid-area:span 1/span 1;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.tJ{grid-area:span 2/span 2;--rot:-2.5deg;border:7px solid #fff;border-bottom-width:26px;border-radius:4px}
.tK{grid-area:span 2/span 2;border-radius:0 70px 0 70px}
.tL{grid-area:span 2/span 2;--rot:2deg;border-radius:18px;border:3px dashed var(--ice)}
.tD.vid::after,.tH.vid::after{top:4px}

/* ---------- 4. VIDEO FRAME (bottom) ---------- */
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
.frame{position:relative;max-width:900px;margin:0 16px;padding:12px;border-radius:30px;background:conic-gradient(from var(--a),var(--sky),var(--ice),var(--gold),var(--rose),var(--sky));animation:spin 8s linear infinite;box-shadow:0 0 44px #4a90e255}
@media(min-width:932px){.frame{margin:0 auto}}
@keyframes spin{to{--a:360deg}}
.frame-in{border-radius:20px;padding:10px;background:var(--night);border:2px dashed #dcebfb88}
.vbox{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--gold);background:linear-gradient(135deg,var(--navy),var(--deep))}
.corner{position:absolute;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--night);border:2px solid var(--gold);color:var(--rose);font-size:1rem;z-index:2}
.c1{top:-12px;left:-12px}.c2{top:-12px;right:-12px}.c3{bottom:-12px;left:-12px}.c4{bottom:-12px;right:-12px}
footer{text-align:center;padding:10px 16px 40px;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:1.2rem;color:var(--gold)}

.home-btn{display:inline-block;margin-top:20px;font-family:"Nunito Sans",system-ui,sans-serif;font-style:normal;font-weight:700;font-size:1rem;text-decoration:none;color:var(--navy);background:var(--gold);padding:12px 32px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.4);transition:transform .15s}
.home-btn:hover{transform:translateY(-2px)}

/* ---------- PAGE-WIDE GLOW BACKGROUND (soft + blurry, fixed behind everything) ---------- */
.glow-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.g{position:absolute;border-radius:50%;will-change:transform;animation:drift 18s ease-in-out infinite alternate}
.g1{width:80vmax;height:80vmax;left:-28vmax;top:-30vmax;background:radial-gradient(circle,#4a90e2,transparent 62%);opacity:.38}
.g2{width:70vmax;height:70vmax;right:-30vmax;top:18vh;background:radial-gradient(circle,#ffb84d,transparent 62%);opacity:.2;animation-duration:22s;animation-delay:-6s}
.g3{width:90vmax;height:90vmax;left:-20vmax;bottom:-45vmax;background:radial-gradient(circle,#2b5fb0,transparent 62%);opacity:.5;animation-duration:26s;animation-delay:-10s}
.g4{width:50vmax;height:50vmax;left:35vw;top:30vh;background:radial-gradient(circle,#ff9bbd,transparent 62%);opacity:.1;animation-duration:20s;animation-delay:-3s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(8vmax,6vmax,0) scale(1.18)}}
.bk{position:absolute;border-radius:50%;opacity:0;will-change:transform,opacity;animation:float ease-in-out infinite alternate}
@keyframes float{0%{opacity:0;transform:translate3d(0,0,0) scale(.8)}50%{opacity:.75}100%{opacity:0;transform:translate3d(var(--dx),var(--dy),0) scale(1.25)}}

/* ---------- GALLERY ZOOM ---------- */
.tile:not(.vid){cursor:zoom-in}
.zoom-btn{position:absolute;left:14px;bottom:10px;z-index:3;width:34px;height:34px;padding:0;display:grid;place-items:center;border-radius:50%;border:2px solid var(--gold);background:#050b1acc;color:var(--gold);cursor:pointer;transition:background .2s,color .2s}
.zoom-btn:hover{background:var(--gold);color:var(--night)}
.zoom-btn svg{width:18px;height:18px}
.tile.vid:not(.has) .zoom-btn{display:none}
.lb{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:60px 16px 24px;overflow:hidden;background:rgba(3,8,22,.94)}
.lb[hidden]{display:none}
.lb-body{display:grid;place-items:center;max-width:100%}
.lb-body img,.lb-body video{max-width:min(94vw,1400px);max-height:calc(100vh - 100px);max-height:calc(100dvh - 100px);border-radius:12px;box-shadow:0 0 44px #4a90e255;background:#000}
.lb-body img{cursor:zoom-in;touch-action:none;transition:transform .25s}
.lb-body img.zoomed{cursor:zoom-out;transform:scale(2.4)}
.lb-close{position:absolute;top:12px;right:14px;width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);background:#050b1acc;color:var(--gold);font-size:1.2rem;cursor:pointer}
.lb-close:hover{background:var(--gold);color:var(--night)}
body.lb-open{overflow:hidden}

/* ---------- Responsive ---------- */
@media(max-width:700px){
  section{padding:40px 0}
  .slide{aspect-ratio:4/3}
  .arrow{width:38px;height:38px}
  .mosaic{grid-template-columns:repeat(2,1fr);gap:10px}
  .tB,.tF{grid-area:span 2/span 2}
  .tA{grid-area:span 3/span 1}
  .tC{grid-area:span 2/span 1}
  .tD{grid-area:span 1/span 2}
  .tG,.tH,.tK,.tL{grid-area:span 2/span 1}
  .tJ{grid-area:span 1/span 1}
  .tF{border-radius:34px 8px 34px 8px}
  .hero{min-height:70vh}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.sp{opacity:.8}.bk{opacity:.35}}
</style>
</head>
<body>

<!-- page-wide glowing background (soft blurry lights, fixed behind all sections) -->
<div class="glow-bg" aria-hidden="true"><i class="g g1"></i><i class="g g2"></i><i class="g g3"></i><i class="g g4"></i></div>

<!-- ============ 1. CAROUSEL (12 slots) ============ -->
<section class="top">
  <div class="head"><h1 style="font-size:clamp(2rem,6vw,3rem);color:#fff">Our 12 Months</h1><p>A year behind, countless memories made, and a lifetime ahead to create more</p></div>
  <div class="carousel" id="carousel">
    <button class="arrow prev" id="prev" aria-label="Previous">&#8249;</button>
    <button class="arrow next" id="next" aria-label="Next">&#8250;</button>
    <div class="track" id="track">
      <!-- SLOT 1: put your image path in src (example: images/slide-1.jpg) -->

      <!-- SLOT 3: put your image path in src -->
      <div class="slide"><img src="../assets/images/dec.jpg" alt="Moment 3" onload="this.parentNode.classList.add('has')" onerror="this.remove()"></div>
      <!-- SLOT 4: put your image path in src -->
      <div class="slide"><img src="../assets/images/jan.jpg" alt="Moment 4" onload="this.parentNode.classList.add('has')" onerror="this.remove()"></div>
      <!-- SLOT 5: put your image path in src -->
      <div class="slide"><img src="../assets/images/feb.jpg" alt="Moment 5" onload="this.parentNode.classList.add('has')" onerror="this.remove()"></div>
      <!-- SLOT 6: put your image path in src -->
      <div class="slide"><img src="../assets/images/mar.jpg" alt="Moment 6" onload="this.parentNode.classList.add('has')" onerror="this.remove()"></div>
      <!-- SLOT 7: put your image path in src -->
      <div class="slide"><img src="../assets/images/apr.jpg" alt="Moment 7" onload="this.parentNode.classList.add('has')" onerror="this.remove()"></div>
      <!-- SLOT 8: put your image path in src -->

      <!-- SLOT 12: put your image path in src -->
      <div class="slide"><img src="../assets/images/sep.jpg" alt="Moment 12" onload="this.parentNode.classList.add('has')" onerror="this.remove()"></div>
    </div>
  </div>
  <div class="dots" id="dots"></div>
</section>

<!-- ============ 2. GLOWING TEXT ============ -->
<section class="hero" id="hero">
  <h2 class="anni" aria-label="1st anniversary"><span class="one" data-text="1st">1st</span><span class="two" data-text="anniversary">anniversary</span></h2>
</section>

<!-- ============ 3. MOSAIC GALLERY: 6 photos + 6 videos ============ -->
<section>
  <div class="head"><h2>The Gallery</h2><p></p></div>
  <div class="mosaic">
    <!-- PHOTO 1: replace the src path with your image -->
    <figure class="tile tA"><span class="ph">Photo 1</span><img src="../assets/images/gal-1.jpg" alt="Photo 1" onload="this.parentNode.classList.add('has')" onerror="this.remove()"></figure>
    <!-- VIDEO 1: replace the src path with your video clip (mp4) -->

    <!-- VIDEO 2 -->
    <figure class="tile tD vid"><span class="ph">Video 2</span><video src="../assets/videos/vid-2.mp4" autoplay muted loop playsinline preload="metadata" onloadeddata="this.parentNode.classList.add('has')"></video></figure>
    <!-- PHOTO 3 -->
    <figure class="tile tE"><span class="ph">Photo 3</span><img src="../assets/images/gal-3.jpeg" alt="Photo 3" onload="this.parentNode.classList.add('has')" onerror="this.remove()"></figure>
    <!-- VIDEO 3 -->

    <!-- PHOTO 4 -->
    <figure class="tile tG"><span class="ph">Photo 4</span><img src="../assets/images/gal-4.jpg" alt="Photo 4" onload="this.parentNode.classList.add('has')" onerror="this.remove()"></figure>
    <!-- VIDEO 4 -->
    <figure class="tile tH vid"><span class="ph">Video 4</span><video src="../assets/videos/vid-4.mp4" autoplay muted loop playsinline preload="metadata" onloadeddata="this.parentNode.classList.add('has')"></video></figure>
    <!-- PHOTO 5 -->
    <figure class="tile tI"><span class="ph">Photo 5</span><img src="../assets/images/gal-5.jpeg" alt="Photo 5" onload="this.parentNode.classList.add('has')" onerror="this.remove()"></figure>
    <!-- VIDEO 5 -->
    <figure class="tile tJ vid"><span class="ph">Video 5</span><video src="../assets/videos/vid-5.mp4" autoplay muted loop playsinline preload="metadata" onloadeddata="this.parentNode.classList.add('has')"></video></figure>
    <!-- PHOTO 6 -->
    <figure class="tile tK"><span class="ph">Photo 6</span><img src="../assets/images/gal-6.jpg" alt="Photo 6" onload="this.parentNode.classList.add('has')" onerror="this.remove()"></figure>
    <!-- VIDEO 6 -->
    <figure class="tile tL vid"><span class="ph">Video 6</span><video src="../assets/videos/vid-6.mp4" autoplay muted loop playsinline preload="metadata" onloadeddata="this.parentNode.classList.add('has')"></video></figure>
  </div>
</section>

<!-- ============ 4. MAIN VIDEO SLOT ============ -->
<section>
  <div class="head"><h2>Our Story in Motion</h2><p>Press play, and remember</p></div>
  <div class="frame">
    <span class="corner c1">&#9829;</span><span class="corner c2">&#9829;</span><span class="corner c3">&#9829;</span><span class="corner c4">&#9829;</span>
    <div class="frame-in">
      <!-- MAIN VIDEO: put your video path in src (example: videos/our-story.mp4). Optional: add poster="images/cover.jpg" -->
      <div class="vbox"><span class="ph">Your video here<small>videos/our-story.mp4</small></span><video src="../assets/videos/main-vid.mp4" controls playsinline preload="metadata" onloadeddata="this.parentNode.classList.add('has')"></video></div>
    </div>
  </div>
</section>
<footer>Happy 1st anniversary, my baby &#9829;<br><!-- Back Home: change href to your homepage path --><a class="home-btn" href="../index.html">Back Home</a></footer>

<!-- zoom viewer for gallery photos and videos -->
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Enlarged view"><button class="lb-close" id="lbClose" type="button" aria-label="Close">&#10005;</button><div class="lb-body" id="lbBody"></div></div>

<script>
// ----- Sparkles around the glowing text -----
const hero = document.getElementById("hero");
const cols = ["#fff", "#dcebfb", "#ffd98a", "#9cc9ff"];
const n = innerWidth < 600 ? 28 : 50;
for (let i = 0; i < n; i++) {
  const s = document.createElement("i");
  const size = 8 + Math.random() * 20;
  s.className = "sp";
  s.style.cssText = `left:${Math.random() * 96}%;top:${Math.random() * 94}%;width:${size}px;height:${size}px;background:${cols[i % 4]};animation-duration:${1.8 + Math.random() * 3}s;animation-delay:-${Math.random() * 5}s`;
  hero.appendChild(s);
}

// ----- Pause animations while off-screen -----
const pauser = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle("paused", !e.isIntersecting)), { rootMargin: "120px" });
pauser.observe(hero);
pauser.observe(document.querySelector(".frame"));

// ----- Carousel (seamless loop) -----
const track = document.getElementById("track");
const slides = [...track.children];          // the 12 real slides
const dotsBox = document.getElementById("dots");
let cur = 0, paused = false, visible = true;

// Invisible copies of the first/last slides sit on each end so the last slide
// keeps sliding forward into the first one (no rewind across the whole track).
const CLONES = 2;
slides.forEach((s, i) => s.dataset.i = i);
const before = slides.slice(-CLONES).map(s => s.cloneNode(true));
const after  = slides.slice(0, CLONES).map(s => s.cloneNode(true));
[...before, ...after].forEach(c => c.setAttribute("aria-hidden", "true"));
track.prepend(...before);
track.append(...after);
const all = [...track.children];

slides.forEach((_, i) => {
  const d = document.createElement("button");
  d.setAttribute("aria-label", "Go to slide " + (i + 1));
  d.onclick = () => goTo(i);
  dotsBox.appendChild(d);
});
const dots = [...dotsBox.children];

const posOf = el => el.offsetLeft - (track.clientWidth - el.offsetWidth) / 2;

function jump(real) {                        // instant move (no animation, no snapping) to a real slide
  track.classList.add("jumping");
  all.forEach(s => s.classList.toggle("active", s === real));
  track.style.scrollSnapType = "none";
  track.scrollLeft = posOf(real);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    track.style.scrollSnapType = "";
    track.classList.remove("jumping");
  }));
}
function normalize() {                       // resting on a copy? silently swap to the real slide
  const mid = track.scrollLeft + track.clientWidth / 2;
  const el = all.find(s => Math.abs(s.offsetLeft + s.offsetWidth / 2 - mid) < 4);
  if (el && !slides.includes(el)) jump(slides[+el.dataset.i]);
}
function goTo(i) {
  normalize();
  cur = (i + slides.length) % slides.length;
  const target = i >= slides.length ? after[0] : i < 0 ? before[CLONES - 1] : slides[i];
  track.scrollTo({ left: posOf(target), behavior: "smooth" });
}
function mark(i, el) {
  cur = i;
  all.forEach(s => s.classList.toggle("active", s === el));
  dots.forEach((d, k) => d.classList.toggle("on", k === i));
}
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) mark(+e.target.dataset.i, e.target);
}), { root: track, threshold: 0.6 });
all.forEach(s => io.observe(s));

// after any scroll/swipe settles on a copy, jump to its real twin
let settle, touching = false;
track.addEventListener("scroll", () => { clearTimeout(settle); settle = setTimeout(() => { if (!touching) normalize(); }, 120); }, { passive: true });
track.addEventListener("touchstart", () => touching = true, { passive: true });
track.addEventListener("touchend", () => { touching = false; clearTimeout(settle); settle = setTimeout(normalize, 150); }, { passive: true });
window.addEventListener("resize", () => jump(slides[cur]));

document.getElementById("prev").onclick = () => goTo(cur - 1);
document.getElementById("next").onclick = () => goTo(cur + 1);
const car = document.getElementById("carousel");
["mouseenter", "touchstart", "focusin"].forEach(ev => car.addEventListener(ev, () => paused = true, { passive: true }));
["mouseleave", "focusout"].forEach(ev => car.addEventListener(ev, () => paused = false));
car.addEventListener("touchend", () => setTimeout(() => paused = false, 4000));
new IntersectionObserver(es => visible = es[0].isIntersecting).observe(car);
setInterval(() => { if (!paused && visible && !document.hidden) goTo(cur + 1); }, 2500);
jump(slides[0]);
mark(0, slides[0]);

// ----- Page-wide glow: floating blurry lights -----
const glow = document.querySelector(".glow-bg");
const bkCols = ["255,255,255", "255,217,138", "156,201,255", "255,155,189"];
for (let i = 0; i < (innerWidth < 600 ? 8 : 16); i++) {
  const d = document.createElement("i"), size = 50 + Math.random() * 110, c = bkCols[i % 4];
  d.className = "bk";
  d.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;width:${size}px;height:${size}px;background:radial-gradient(circle,rgba(${c},.5),rgba(${c},0) 70%);--dx:${(Math.random() - .5) * 160}px;--dy:${(Math.random() - .5) * 160}px;animation-duration:${9 + Math.random() * 10}s;animation-delay:-${Math.random() * 12}s`;
  glow.appendChild(d);
}

// ----- Gallery: zoom viewer -----
const lb = document.getElementById("lb"), lbBody = document.getElementById("lbBody"), lbClose = document.getElementById("lbClose");
const tileVideos = [...document.querySelectorAll(".mosaic video")];
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let lastFocus = null;

function openViewer(node) {
  lastFocus = document.activeElement;
  lbBody.replaceChildren(node);
  lb.hidden = false;
  document.body.classList.add("lb-open");
  syncVideos();
  lbClose.focus();
}
function closeViewer() {
  if (lb.hidden) return;
  const v = lbBody.querySelector("video");
  if (v) { v.pause(); v.removeAttribute("src"); v.load(); }
  lbBody.replaceChildren();
  lb.hidden = true;
  document.body.classList.remove("lb-open");
  syncVideos();
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
lbClose.onclick = closeViewer;
lb.addEventListener("click", e => { if (e.target === lb || e.target === lbBody) closeViewer(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeViewer(); });

// Photos: click a photo to open it; click it again to zoom in (move the pointer/finger to pan)
document.querySelectorAll(".mosaic .tile:not(.vid)").forEach(t => {
  t.tabIndex = 0;
  const open = () => {
    const src = t.querySelector("img");
    if (!src) return;                                   // empty slot, nothing to zoom
    const im = document.createElement("img");
    im.src = src.currentSrc || src.src; im.alt = src.alt;
    let base = null;
    const origin = e => {
      im.style.transformOrigin = Math.max(0, Math.min(100, (e.clientX - base.left) / base.width * 100)) + "% " +
                                 Math.max(0, Math.min(100, (e.clientY - base.top) / base.height * 100)) + "%";
    };
    im.addEventListener("click", e => {
      if (im.classList.contains("zoomed")) { im.classList.remove("zoomed"); return; }
      base = im.getBoundingClientRect();
      origin(e);
      im.classList.add("zoomed");
    });
    im.addEventListener("pointermove", e => { if (base && im.classList.contains("zoomed")) origin(e); });
    openViewer(im);
  };
  t.addEventListener("click", open);
  t.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
});

// Videos: a zoom icon on each clip opens it bigger, with sound and controls
document.querySelectorAll(".mosaic .tile.vid").forEach(t => {
  const v = t.querySelector("video");
  const b = document.createElement("button");
  b.type = "button"; b.className = "zoom-btn"; b.setAttribute("aria-label", "Zoom video");
  b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M10.5 7.5v6M7.5 10.5h6"/></svg>';
  b.onclick = e => {
    e.stopPropagation();
    const z = document.createElement("video");
    z.src = v.currentSrc || v.src; z.controls = true; z.autoplay = true; z.playsInline = true;
    const t0 = v.currentTime;
    z.addEventListener("loadedmetadata", () => { try { z.currentTime = t0; } catch (_) {} }, { once: true });
    openViewer(z);
    z.play().catch(() => {});
  };
  t.appendChild(b);
});

// Small (minimized) gallery videos: autoplay, muted, looping, only while mostly on screen
// (phones play at most 3 at once, so scrolling stays smooth)
const MAX_PLAYING = innerWidth < 700 ? 3 : tileVideos.length;
function syncVideos() {
  const live = (lb.hidden && !document.hidden && !reduceMotion)
    ? tileVideos.filter(v => v._r >= 0.4).sort((a, b) => b._r - a._r).slice(0, MAX_PLAYING) : [];
  tileVideos.forEach(v => { if (live.includes(v)) v.play().catch(() => {}); else v.pause(); });
}
const vio = new IntersectionObserver(es => { es.forEach(e => e.target._r = e.isIntersecting ? e.intersectionRatio : 0); syncVideos(); }, { threshold: [0, 0.25, 0.4, 0.5, 0.75, 1] });
tileVideos.forEach(v => { v._r = 0; v.muted = true; v.loop = true; v.playsInline = true; vio.observe(v); });
document.addEventListener("visibilitychange", syncVideos);
</script>
</body>
</html>
